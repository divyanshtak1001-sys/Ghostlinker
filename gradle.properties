# ─── GhostLink Gradle configuration ───────────────────────────────────────────
# Required: this project uses AndroidX and Jetpack Compose throughout.
android.useAndroidX=true

# Kotlin code style for the Compose compiler.
android.nonTransitiveRClass=true

# Build performance (does not disable any check).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official

# The Android Gradle Plugin 8.5.2 warns when compileSdk = 35 exceeds the
# level it was tested against (34). The project targets 35 deliberately
# (NEARBY_WIFI_DEVICES / BLUETOOTH_* runtime permission model), so silence
# the advisory warning without changing the compile target.
android.suppressUnsupportedCompileSdk=35
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
